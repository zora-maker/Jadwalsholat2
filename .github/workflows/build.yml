name: Build Signed APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q annur-jadwal-widget-android-signed.zip \
            -d "$RUNNER_TEMP/project"
          echo "PROJECT_DIR=$RUNNER_TEMP/project/annur-widget" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Siapkan Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

      - name: Build Signed APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
        run: gradle bundleleRelease --no-daemon

      - uses: actions/upload-artifact@v4
  with:
    name: jadwal-sholat-release-aab
    path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
